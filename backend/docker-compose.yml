services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asaphis
      POSTGRES_PASSWORD: asaphis
      POSTGRES_DB: asaphis
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://asaphis:asaphis@postgres:5432/asaphis?schema=public
      REDIS_URL: redis://redis:6379
    ports: ["4000:4000"]
    depends_on: [postgres, redis]
volumes:
  pgdata: {}
